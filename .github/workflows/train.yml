name: Train Model

# The win model (win bar and ban suggestions) trains in minutes on a CPU runner, so it
# retrains after every successful data validation. The pick model is too large for a CPU
# runner at Champion+ dataset sizes: train it on a GPU with
# workflow_scripts/colab_train_rec_model.ipynb and commit data/rec_model.h5 + rec_variables.pkl.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate Data"]
    types:
      - completed

jobs:
  run_script:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: update-data

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workflow_scripts/tf_requirements.txt
          echo "TF_USE_LEGACY_KERAS=True" >> $GITHUB_ENV

      - name: "Train win model"
        run: |
          python workflow_scripts/get_win_model.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date +"%Y-%m-%d")
          git add data/win_model.h5 data/win_model_heroes.json
          git commit -m "Update win model by GitHub Actions on $DATE"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_SECRET }}
