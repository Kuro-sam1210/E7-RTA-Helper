name: Validate Data

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Data"]
    types:
      - completed

jobs:
  run_script:
    # Only validate data that was updated successfully
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: update-data

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workflow_scripts/requirements.txt

      # (The old "Merge csvs" step archived uncompressed copies into match_histories/;
      # get_matches.py now deduplicates battles itself through its cache.)
      - name: "Start Validation"
        run: |
          python workflow_scripts/data_validate.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date +"%Y-%m-%d")
          git add data/ versions.json
          git commit -m "Check Data by GitHub Actions on $DATE"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATE_SECRET }}
